name: Duplicate Issue Detection

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to scan
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: duplicate-detection-${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect duplicate issue or pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Detect and mark duplicates
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const detect = require('./.github/scripts/duplicate-detector/index.js');
            await detect({ github, context, core });
